<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPERNOVA // STELLAR COLLAPSE</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
}

#ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.panel {
    position: absolute;
    top: 22px;
    left: 22px;
    width: 235px;
    padding: 16px;
    border: 1px solid rgba(255,255,255,.15);
    background: rgba(5,7,15,.55);
    backdrop-filter: blur(14px);
    box-shadow: 0 0 40px rgba(80,100,255,.08);
}

.title {
    font-size: 12px;
    letter-spacing: 4px;
    color: #9fb5ff;
    margin-bottom: 15px;
}

.stat {
    display: flex;
    justify-content: space-between;
    margin: 9px 0;
    font-size: 10px;
    letter-spacing: 1px;
}

.value {
    color: #fff;
    font-weight: bold;
}

.bar {
    height: 3px;
    background: rgba(255,255,255,.08);
    margin-top: 5px;
}

.bar i {
    display: block;
    height: 100%;
    width: 30%;
    background: linear-gradient(90deg,#ff3b1f,#ffd36b,#fff);
    box-shadow: 0 0 10px #ff5722;
}

#stageText {
    color: #ffb35c;
}

.timeline {
    position: absolute;
    left: 50%;
    bottom: 35px;
    transform: translateX(-50%);
    width: min(600px,80vw);
}

.line {
    height: 1px;
    background: rgba(255,255,255,.25);
    position: relative;
}

.nodes {
    display: flex;
    justify-content: space-between;
}

.node {
    position: relative;
    top: -5px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.5);
    background: #05060c;
}

.node.active {
    background: white;
    box-shadow: 0 0 15px white;
}

.labels {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    font-size: 8px;
    letter-spacing: 2px;
    color: #68708a;
}

.labels .active {
    color: white;
}

.controls {
    position: absolute;
    right: 22px;
    bottom: 25px;
    display: flex;
    gap: 8px;
    pointer-events: auto;
}

button {
    border: 1px solid rgba(255,255,255,.2);
    color: white;
    background: rgba(8,10,20,.65);
    backdrop-filter: blur(10px);
    padding: 10px 13px;
    font-size: 9px;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    background: rgba(255,255,255,.15);
    box-shadow: 0 0 20px rgba(255,120,50,.25);
}

#hint {
    position: absolute;
    right: 22px;
    top: 22px;
    text-align: right;
    font-size: 8px;
    line-height: 1.9;
    letter-spacing: 1.5px;
    color: rgba(255,255,255,.4);
}

#flash {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    mix-blend-mode: screen;
}

#vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(circle at center,
        transparent 35%,
        rgba(0,0,0,.2) 65%,
        rgba(0,0,0,.85) 100%);
}

@media(max-width:700px) {
    .panel {
        transform: scale(.82);
        transform-origin: top left;
    }

    #hint {
        display:none;
    }

    .controls {
        left: 50%;
        right:auto;
        transform:translateX(-50%);
        bottom:75px;
    }

    button {
        padding:8px 9px;
        font-size:8px;
    }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="flash"></div>
<div id="vignette"></div>

<div id="ui">

    <div class="panel">

        <div class="title">STELLAR OBSERVATORY</div>

        <div class="stat">
            <span>STELLAR MASS</span>
            <span class="value" id="mass">24.7 M☉</span>
        </div>

        <div class="stat">
            <span>CORE TEMP.</span>
            <span class="value" id="temp">8.2×10⁸ K</span>
        </div>

        <div class="stat">
            <span>ENERGY</span>
            <span class="value" id="energy">32%</span>
        </div>

        <div class="bar">
            <i id="energyBar"></i>
        </div>

        <div class="stat">
            <span>PARTICLES</span>
            <span class="value" id="particles">0</span>
        </div>

        <div class="stat">
            <span>STAGE</span>
            <span class="value" id="stageText">STABLE</span>
        </div>

    </div>

    <div id="hint">
        MOVE MOUSE — GRAVITY FIELD<br>
        CLICK — ENERGY BURST<br>
        DOUBLE CLICK — SUPERNOVA<br>
        DRAG — ROTATE FIELD<br>
        WHEEL — ZOOM
    </div>

    <div class="timeline">

        <div class="line"></div>

        <div class="nodes">
            <div class="node active"></div>
            <div class="node"></div>
            <div class="node"></div>
            <div class="node"></div>
        </div>

        <div class="labels">
            <span class="active">STABLE</span>
            <span>COLLAPSE</span>
            <span>EXPLOSION</span>
            <span>REMNANT</span>
        </div>

    </div>

    <div class="controls">
        <button id="explode">TRIGGER SUPERNOVA</button>
        <button id="reset">RESET STAR</button>
        <button id="pause">PAUSE</button>
    </div>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { alpha:false });

let W, H, CX, CY;
let DPR = Math.min(devicePixelRatio || 1, 2);

function resize(){

    W = innerWidth;
    H = innerHeight;

    canvas.width = W * DPR;
    canvas.height = H * DPR;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(DPR,0,0,DPR,0,0);

    CX = W/2;
    CY = H/2;

}

resize();
addEventListener("resize",resize);


// =====================================================
// STATE
// =====================================================

let paused = false;

let stage = "stable";

let cycle = 0;
let explosion = 0;

let zoom = 1;

let cameraShake = 0;

let rotation = 0;

let mouse = {
    x:CX,
    y:CY,
    down:false
};

let particles = [];

let shockwaves = [];

let bursts = [];

let stars = [];

let nebula = [];


// =====================================================
// RANDOM HELPERS
// =====================================================

function rand(a,b){
    return a + Math.random()*(b-a);
}

function gauss(){
    return (Math.random()+Math.random()+Math.random()+Math.random())/4;
}


// =====================================================
// BACKGROUND STARS
// =====================================================

for(let i=0;i<800;i++){

    stars.push({

        x:Math.random(),
        y:Math.random(),

        r:Math.random()*1.5,

        a:Math.random(),

        phase:Math.random()*Math.PI*2,

        speed:rand(.5,2)

    });

}


// =====================================================
// PARTICLES
// =====================================================

const MAX_PARTICLES = 10000;

function makeParticle(type="plasma"){

    let angle = Math.random()*Math.PI*2;

    let radius;

    if(stage==="stable" || stage==="collapse"){
        radius = rand(35,230);
    }
    else{
        radius = rand(20,60);
    }

    return {

        x:Math.cos(angle)*radius,

        y:Math.sin(angle)*radius,

        vx:Math.cos(angle)*rand(.1,.8),

        vy:Math.sin(angle)*rand(.1,.8),

        size:rand(.3,2),

        life:1,

        maxLife:rand(2,8),

        age:0,

        energy:Math.random(),

        type:type,

        color:Math.random(),

        trail:[],

        angle,

        radius

    };

}


function initializeParticles(){

    particles.length=0;

    for(let i=0;i<MAX_PARTICLES;i++){

        let types=["plasma","plasma","plasma","dust","radiation"];

        particles.push(
            makeParticle(types[Math.floor(Math.random()*types.length)])
        );

    }

}

initializeParticles();


// =====================================================
// NEBULA PARTICLES
// =====================================================

for(let i=0;i<1600;i++){

    let a=Math.random()*Math.PI*2;

    let r=Math.pow(Math.random(),.45)*700;

    nebula.push({

        a,

        r,

        size:rand(1,7),

        speed:rand(.0001,.001),

        phase:Math.random()*Math.PI*2,

        alpha:rand(.05,.25)

    });

}


// =====================================================
// STAR DRAWING
// =====================================================

function drawStar(){

    if(stage==="explosion" || stage==="remnant")
        return;

    let pulse =
        Math.sin(cycle*2.2)*
        (stage==="collapse" ? 20 : 6);

    let radius =
        Math.min(W,H)*.105 +
        pulse;

    if(stage==="collapse"){

        radius *=
            1 +
            Math.sin(cycle*9)*.08;

    }

    ctx.save();

    ctx.translate(CX,CY);

    // giant outer corona

    let corona =
        ctx.createRadialGradient(0,0,radius*.2,0,0,radius*3);

    corona.addColorStop(0,"rgba(255,255,255,.95)");

    corona.addColorStop(.08,"rgba(255,245,180,.85)");

    corona.addColorStop(.25,"rgba(255,120,30,.35)");

    corona.addColorStop(.6,"rgba(255,40,10,.08)");

    corona.addColorStop(1,"rgba(255,0,0,0)");

    ctx.fillStyle=corona;

    ctx.beginPath();

    ctx.arc(0,0,radius*3,0,Math.PI*2);

    ctx.fill();


    // plasma flares

    for(let i=0;i<16;i++){

        let a =
            i*Math.PI*2/16 +
            cycle*.15;

        let length =
            radius*rand(1.3,2.3);

        let width =
            radius*rand(.04,.12);

        ctx.save();

        ctx.rotate(a);

        let g=ctx.createLinearGradient(
            radius*.6,0,
            length,0
        );

        g.addColorStop(0,"rgba(255,255,180,.7)");

        g.addColorStop(.3,"rgba(255,110,20,.4)");

        g.addColorStop(1,"rgba(255,0,0,0)");

        ctx.fillStyle=g;

        ctx.beginPath();

        ctx.moveTo(radius*.5,-width);

        ctx.quadraticCurveTo(
            radius*1.3,
            Math.sin(cycle*4+i)*radius*.2,
            length,
            0
        );

        ctx.quadraticCurveTo(
            radius*1.3,
            -Math.sin(cycle*4+i)*radius*.2,
            radius*.5,
            width
        );

        ctx.fill();

        ctx.restore();

    }


    // star body

    let body=ctx.createRadialGradient(
        -radius*.25,
        -radius*.25,
        radius*.05,
        0,
        0,
        radius
    );

    body.addColorStop(0,"#ffffff");

    body.addColorStop(.18,"#fffbd2");

    body.addColorStop(.42,"#ffd45c");

    body.addColorStop(.7,"#ff741e");

    body.addColorStop(1,"#8d1707");

    ctx.fillStyle=body;

    ctx.beginPath();

    ctx.arc(0,0,radius,0,Math.PI*2);

    ctx.fill();


    // turbulent plasma patches

    for(let i=0;i<70;i++){

        let a=Math.random()*Math.PI*2;

        let r=Math.sqrt(Math.random())*radius;

        let x=Math.cos(a)*r;

        let y=Math.sin(a)*r;

        let s=rand(2,15);

        ctx.fillStyle =
            Math.random()>.5
            ? "rgba(255,255,200,.08)"
            : "rgba(120,20,0,.1)";

        ctx.beginPath();

        ctx.arc(x,y,s,0,Math.PI*2);

        ctx.fill();

    }

    ctx.restore();

}


// =====================================================
// GRAVITATIONAL FIELD
// =====================================================

function gravitationalForce(p){

    let dx = mouse.x-CX-p.x;

    let dy = mouse.y-CY-p.y;

    let d2 = dx*dx+dy*dy;

    let d=Math.sqrt(d2)+1;

    if(d>450)
        return [0,0];

    let strength =
        (1-d/450)*.18;

    return [
        dx/d*strength,
        dy/d*strength
    ];

}


// =====================================================
// PARTICLE UPDATE
// =====================================================

function updateParticles(dt){

    for(let p of particles){

        let oldX=p.x;
        let oldY=p.y;

        if(stage==="stable"){

            let a=Math.atan2(p.y,p.x);

            let tangent=.015;

            p.vx += -Math.sin(a)*tangent;
            p.vy += Math.cos(a)*tangent;

        }

        else if(stage==="collapse"){

            let d=Math.sqrt(p.x*p.x+p.y*p.y)+1;

            p.vx -= p.x/d*.03;
            p.vy -= p.y/d*.03;

        }

        else if(stage==="explosion"){

            let d=Math.sqrt(p.x*p.x+p.y*p.y)+1;

            let force =
                2.5 /
                (1+d*.001);

            p.vx += p.x/d*force;
            p.vy += p.y/d*force;

        }

        else if(stage==="remnant"){

            let a=Math.atan2(p.y,p.x);

            p.vx += -Math.sin(a)*.003;
            p.vy += Math.cos(a)*.003;

        }


        // mouse gravity

        let g=gravitationalForce(p);

        p.vx += g[0];
        p.vy += g[1];


        // drag

        p.vx *= .998;
        p.vy *= .998;


        // explosion boost

        if(explosion>0){

            let d=Math.sqrt(p.x*p.x+p.y*p.y)+1;

            p.vx += p.x/d*explosion*.08;
            p.vy += p.y/d*explosion*.08;

        }


        p.x += p.vx*dt*60;
        p.y += p.vy*dt*60;


        p.age += dt;

        p.life =
            Math.max(
                0,
                1-p.age/p.maxLife
            );


        // trails

        p.trail.push([oldX,oldY]);

        if(p.trail.length>5)
            p.trail.shift();


        // recycle

        let dist =
            Math.sqrt(
                p.x*p.x+
                p.y*p.y
            );

        if(
            p.age>p.maxLife ||
            dist>1300
        ){

            let q=makeParticle(p.type);

            p.x=q.x;
            p.y=q.y;
            p.vx=q.vx;
            p.vy=q.vy;
            p.age=0;
            p.maxLife=q.maxLife;
            p.life=1;

        }

    }

}


// =====================================================
// PARTICLE DRAW
// =====================================================

function drawParticles(){

    ctx.save();

    ctx.translate(CX,CY);

    ctx.globalCompositeOperation="lighter";

    for(let p of particles){

        let color;

        if(p.type==="dust")
            color=`rgba(150,90,60,${p.life*.45})`;

        else if(p.type==="radiation")
            color=`rgba(130,190,255,${p.life*.65})`;

        else{

            let c=p.color;

            if(c<.33)
                color=`rgba(255,90,20,${p.life*.75})`;

            else if(c<.66)
                color=`rgba(255,190,60,${p.life*.8})`;

            else
                color=`rgba(160,210,255,${p.life*.7})`;

        }

        ctx.strokeStyle=color;

        ctx.lineWidth=p.size*.7;

        if(p.trail.length>1){

            ctx.beginPath();

            ctx.moveTo(
                p.trail[0][0],
                p.trail[0][1]
            );

            for(let i=1;i<p.trail.length;i++){

                ctx.lineTo(
                    p.trail[i][0],
                    p.trail[i][1]
                );

            }

            ctx.stroke();

        }

        ctx.fillStyle=color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.restore();

}


// =====================================================
// SHOCKWAVES
// =====================================================

function createShockwave(power=1){

    shockwaves.push({

        radius:10,

        speed:rand(5,9)*power,

        alpha:1,

        width:rand(5,20),

        power

    });

}


function drawShockwaves(dt){

    ctx.save();

    ctx.translate(CX,CY);

    ctx.globalCompositeOperation="lighter";

    for(let s of shockwaves){

        s.radius += s.speed*dt*60;

        s.alpha *= .987;

        ctx.lineWidth=s.width;

        ctx.strokeStyle=
            `rgba(255,${180+Math.random()*70},${120+Math.random()*100},${s.alpha})`;

        ctx.shadowBlur=30;

        ctx.shadowColor="#fff";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            s.radius,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }

    ctx.restore();

    shockwaves =
        shockwaves.filter(
            s=>s.alpha>.01
        );

}


// =====================================================
// ENERGY BURSTS
// =====================================================

function createBurst(x,y){

    bursts.push({

        x:x-CX,

        y:y-CY,

        r:5,

        alpha:1

    });

}


function drawBursts(){

    ctx.save();

    ctx.translate(CX,CY);

    ctx.globalCompositeOperation="lighter";

    for(let b of bursts){

        b.r += 7;

        b.alpha *= .93;

        let g=ctx.createRadialGradient(
            b.x,b.y,0,
            b.x,b.y,b.r
        );

        g.addColorStop(
            0,
            `rgba(255,255,255,${b.alpha})`
        );

        g.addColorStop(
            .2,
            `rgba(100,200,255,${b.alpha*.6})`
        );

        g.addColorStop(
            1,
            "rgba(0,100,255,0)"
        );

        ctx.fillStyle=g;

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.r,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.restore();

    bursts=bursts.filter(b=>b.alpha>.02);

}


// =====================================================
// NEBULA
// =====================================================

function drawNebula(){

    if(stage!=="remnant" && explosion<.2)
        return;

    ctx.save();

    ctx.translate(CX,CY);

    ctx.globalCompositeOperation="lighter";

    for(let n of nebula){

        n.a += n.speed;

        let r =
            n.r *
            Math.min(
                1.5,
                Math.max(.2,explosion)
            );

        let x=Math.cos(n.a)*r;

        let y=Math.sin(n.a)*r*.72;

        let cloud =
            ctx.createRadialGradient(
                x,y,0,
                x,y,n.size*10
            );

        let type =
            Math.sin(n.phase+n.a*4);

        if(type>.45){

            cloud.addColorStop(
                0,
                `rgba(70,140,255,${n.alpha})`
            );

        }
        else if(type<-.4){

            cloud.addColorStop(
                0,
                `rgba(180,40,255,${n.alpha})`
            );

        }
        else{

            cloud.addColorStop(
                0,
                `rgba(255,80,30,${n.alpha})`
            );

        }

        cloud.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );

        ctx.fillStyle=cloud;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            n.size*10,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.restore();

}


// =====================================================
// BLACK HOLE / NEUTRON STAR
// =====================================================

function drawRemnant(){

    if(stage!=="remnant")
        return;

    ctx.save();

    ctx.translate(CX,CY);

    ctx.globalCompositeOperation="lighter";


    // accretion disk

    for(let i=0;i<4;i++){

        ctx.beginPath();

        ctx.ellipse(
            0,
            0,
            100+i*15,
            25+i*5,
            rotation,
            0,
            Math.PI*2
        );

        ctx.strokeStyle=
            `rgba(255,${80+i*35},30,${.12-i*.02})`;

        ctx.lineWidth=5;

        ctx.shadowBlur=25;

        ctx.shadowColor="#ff5500";

        ctx.stroke();

    }


    // event horizon glow

    let g=ctx.createRadialGradient(
        0,0,2,
        0,0,80
    );

    g.addColorStop(0,"#000");

    g.addColorStop(.25,"#000");

    g.addColorStop(.45,"rgba(50,20,10,.9)");

    g.addColorStop(.7,"rgba(255,80,20,.15)");

    g.addColorStop(1,"rgba(255,0,0,0)");

    ctx.fillStyle=g;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        80,
        0,
        Math.PI*2
    );

    ctx.fill();


    // black center

    ctx.fillStyle="#000";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        24,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}


// =====================================================
// SUPERNOVA
// =====================================================

function triggerSupernova(){

    if(stage==="explosion" || stage==="remnant")
        return;

    stage="collapse";

    explosion=0;

    cycle=0;

}


function beginExplosion(){

    stage="explosion";

    explosion=1;

    cameraShake=35;

    createShockwave(2);

    createShockwave(1.4);

    createShockwave(.8);

    document.getElementById("flash").style.opacity=.9;

    setTimeout(()=>{
        document.getElementById("flash").style.opacity=0;
    },80);

}


// =====================================================
// RESET
// =====================================================

function reset(){

    stage="stable";

    cycle=0;

    explosion=0;

    shockwaves.length=0;

    bursts.length=0;

    cameraShake=0;

    initializeParticles();

}


// =====================================================
// UPDATE STAGE
// =====================================================

function updateStage(dt){

    cycle += dt;

    rotation += dt*.2;

    if(stage==="stable"){

        if(cycle>12){

            stage="collapse";

            cycle=0;

        }

    }

    else if(stage==="collapse"){

        if(cycle>6){

            beginExplosion();

            cycle=0;

        }

    }

    else if(stage==="explosion"){

        explosion += dt*.12;

        cameraShake *= .96;

        if(cycle>9){

            stage="remnant";

            cycle=0;

            explosion=1;

        }

    }

    else if(stage==="remnant"){

        explosion += dt*.01;

    }

}


// =====================================================
// BACKGROUND
// =====================================================

function drawBackground(){

    ctx.fillStyle="#00020a";

    ctx.fillRect(0,0,W,H);

    for(let s of stars){

        let x=s.x*W;

        let y=s.y*H;

        let a=
            .25+
            Math.sin(cycle*s.speed+s.phase)*.25+
            .2;

        ctx.fillStyle=
            `rgba(190,210,255,${a})`;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            s.r,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


// =====================================================
// MAIN LOOP
// =====================================================

let last=performance.now();

function animate(now){

    requestAnimationFrame(animate);

    if(paused)
        return;

    let dt=
        Math.min(
            .035,
            (now-last)/1000
        );

    last=now;


    updateStage(dt);

    updateParticles(dt);


    drawBackground();


    // camera shake

    let shakeX=0;
    let shakeY=0;

    if(cameraShake>0){

        shakeX=rand(
            -cameraShake,
            cameraShake
        );

        shakeY=rand(
            -cameraShake,
            cameraShake
        );

    }


    ctx.save();

    ctx.translate(shakeX,shakeY);

    ctx.translate(
        CX,
        CY
    );

    ctx.scale(
        zoom,
        zoom
    );

    ctx.translate(
        -CX,
        -CY
    );


    drawNebula();

    drawParticles();

    drawStar();

    drawShockwaves(dt);

    drawBursts();

    drawRemnant();


    // supernova core flash

    if(stage==="explosion"){

        let pulse=
            Math.max(
                0,
                1-cycle*.12
            );

        let g=ctx.createRadialGradient(
            CX,
            CY,
            0,
            CX,
            CY,
            500*pulse
        );

        g.addColorStop(
            0,
            `rgba(255,255,255,${pulse})`
        );

        g.addColorStop(
            .1,
            `rgba(255,240,180,${pulse*.8})`
        );

        g.addColorStop(
            .35,
            `rgba(255,80,20,${pulse*.25})`
        );

        g.addColorStop(
            1,
            "rgba(255,0,0,0)"
        );

        ctx.globalCompositeOperation="lighter";

        ctx.fillStyle=g;

        ctx.fillRect(
            CX-600,
            CY-600,
            1200,
            1200
        );

    }

    ctx.restore();


    // UI

    updateUI();

}

requestAnimationFrame(animate);


// =====================================================
// UI
// =====================================================

function updateUI(){

    let energy;

    if(stage==="stable")
        energy=25+cycle/12*30;

    else if(stage==="collapse")
        energy=55+cycle/6*45;

    else
        energy=100;

    energy=Math.min(100,energy);

    document.getElementById("energy").textContent=
        Math.floor(energy)+"%";

    document.getElementById("energyBar").style.width=
        energy+"%";

    document.getElementById("particles").textContent=
        particles.length.toLocaleString();

    let temp;

    if(stage==="stable")
        temp=8.2;

    else if(stage==="collapse")
        temp=8.2+cycle*3;

    else
        temp=99.9;

    document.getElementById("temp").textContent=
        temp.toFixed(1)+"×10⁸ K";

    document.getElementById("stageText").textContent=
        stage.toUpperCase();


    let nodes=
        document.querySelectorAll(".node");

    nodes.forEach(n=>n.classList.remove("active"));

    if(stage==="stable")
        nodes[0].classList.add("active");

    if(stage==="collapse")
        nodes[1].classList.add("active");

    if(stage==="explosion")
        nodes[2].classList.add("active");

    if(stage==="remnant")
        nodes[3].classList.add("active");

}


// =====================================================
// MOUSE
// =====================================================

canvas.addEventListener("mousemove",e=>{

    mouse.x=e.clientX;
    mouse.y=e.clientY;

});


canvas.addEventListener("mousedown",e=>{

    mouse.down=true;

    createBurst(
        e.clientX,
        e.clientY
    );

});


canvas.addEventListener("mouseup",()=>{

    mouse.down=false;

});


canvas.addEventListener("dblclick",()=>{

    triggerSupernova();

});


canvas.addEventListener(
    "wheel",
    e=>{

        e.preventDefault();

        zoom +=
            e.deltaY<0
            ? .08
            : -.08;

        zoom=
            Math.max(
                .55,
                Math.min(2.5,zoom)
            );

    },
    {passive:false}
);


// =====================================================
// TOUCH
// =====================================================

canvas.addEventListener(
    "touchmove",
    e=>{

        let t=e.touches[0];

        mouse.x=t.clientX;

        mouse.y=t.clientY;

    },
    {passive:true}
);

canvas.addEventListener(
    "touchstart",
    e=>{

        let t=e.touches[0];

        mouse.x=t.clientX;

        mouse.y=t.clientY;

        createBurst(
            mouse.x,
            mouse.y
        );

    },
    {passive:true}
);


// =====================================================
// BUTTONS
// =====================================================

document
.getElementById("explode")
.addEventListener(
    "click",
    triggerSupernova
);


document
.getElementById("reset")
.addEventListener(
    "click",
    reset
);


document
.getElementById("pause")
.addEventListener(
    "click",
    function(){

        paused=!paused;

        this.textContent=
            paused
            ? "RESUME"
            : "PAUSE";

    }
);


// =====================================================
// EXTRA INTERACTION
// =====================================================

setInterval(()=>{

    if(stage==="collapse"){

        createShockwave(
            Math.random()*.4
        );

    }

},1200);


</script>
