<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Into The Deep</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #00040b;
            font-family: Arial, Helvetica, sans-serif;
            touch-action: none;
        }

        body {
            position: relative;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* TOP TITLE */

        .title {
            position: fixed;
            top: 42px;
            left: 50%;
            transform: translateX(-50%);

            z-index: 20;

            color: rgba(170, 210, 240, 0.7);

            font-size: 12px;
            font-weight: 500;

            letter-spacing: 9px;
            text-transform: uppercase;

            white-space: nowrap;

            pointer-events: none;
        }

        /* BOTTOM TEXT */

        .instruction {
            position: fixed;
            left: 50%;
            bottom: 35px;

            transform: translateX(-50%);

            z-index: 20;

            color: rgba(150, 200, 230, 0.42);

            font-size: 10px;
            letter-spacing: 5px;

            text-transform: uppercase;

            white-space: nowrap;

            pointer-events: none;

            transition: opacity 1s ease;
        }

        /* SMALL UI */

        .depth {
            position: fixed;
            left: 35px;
            bottom: 35px;

            color: rgba(130, 190, 230, 0.28);

            font-size: 9px;
            letter-spacing: 3px;

            z-index: 20;

            pointer-events: none;
        }

        .status {
            position: fixed;
            right: 35px;
            bottom: 35px;

            color: rgba(130, 190, 230, 0.28);

            font-size: 9px;
            letter-spacing: 3px;

            z-index: 20;

            pointer-events: none;
        }

        @media (max-width: 700px) {

            .title {
                top: 25px;
                font-size: 9px;
                letter-spacing: 6px;
            }

            .instruction {
                bottom: 25px;
                font-size: 8px;
                letter-spacing: 3px;
            }

            .depth,
            .status {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="title">
        INTO THE DEEP
    </div>

    <div
        class="instruction"
        id="instruction"
    >
        MOVE • TOUCH • EXPLORE
    </div>

    <div class="depth">
        DEPTH 0847M
    </div>

    <div class="status">
        OCEAN // ALIVE
    </div>

    <canvas id="ocean"></canvas>


    <script>

        /* =====================================================
           CANVAS SETUP
        ===================================================== */

        const canvas = document.getElementById("ocean");
        const ctx = canvas.getContext("2d");

        let width = window.innerWidth;
        let height = window.innerHeight;

        let pixelRatio = Math.min(window.devicePixelRatio || 1, 2);


        function resizeCanvas() {

            width = window.innerWidth;
            height = window.innerHeight;

            pixelRatio =
                Math.min(window.devicePixelRatio || 1, 2);

            canvas.width =
                width * pixelRatio;

            canvas.height =
                height * pixelRatio;

            canvas.style.width =
                width + "px";

            canvas.style.height =
                height + "px";

            ctx.setTransform(
                pixelRatio,
                0,
                0,
                pixelRatio,
                0,
                0
            );
        }


        window.addEventListener(
            "resize",
            resizeCanvas
        );

        resizeCanvas();


        /* =====================================================
           MOUSE / TOUCH
        ===================================================== */

        const pointer = {

            x: width / 2,
            y: height / 2,

            targetX: width / 2,
            targetY: height / 2,

            down: false,

            hasMoved: false
        };


        window.addEventListener(
            "pointermove",
            function(event) {

                pointer.targetX =
                    event.clientX;

                pointer.targetY =
                    event.clientY;

                pointer.hasMoved = true;

            }
        );


        window.addEventListener(
            "pointerdown",
            function(event) {

                pointer.down = true;

                pointer.targetX =
                    event.clientX;

                pointer.targetY =
                    event.clientY;

                createRipple(
                    event.clientX,
                    event.clientY
                );

                document
                    .getElementById("instruction")
                    .style.opacity = "0";

            }
        );


        window.addEventListener(
            "pointerup",
            function() {

                pointer.down = false;

            }
        );


        window.addEventListener(
            "pointercancel",
            function() {

                pointer.down = false;

            }
        );


        /* =====================================================
           UTILITY
        ===================================================== */

        function random(min, max) {

            return Math.random() *
                (max - min) + min;

        }


        function clamp(value, min, max) {

            return Math.max(
                min,
                Math.min(max, value)
            );

        }


        /* =====================================================
           STAR / PARTICLE FIELD
        ===================================================== */

        const particles = [];

        const PARTICLE_COUNT = 900;


        function createParticles() {

            particles.length = 0;

            for (
                let i = 0;
                i < PARTICLE_COUNT;
                i++
            ) {

                particles.push({

                    x: random(0, width),

                    y: random(0, height),

                    size: random(0.4, 2.2),

                    speed: random(0.08, 0.55),

                    drift: random(-0.12, 0.12),

                    alpha: random(0.15, 0.75),

                    phase: random(
                        0,
                        Math.PI * 2
                    )

                });

            }
        }


        createParticles();


        /* =====================================================
           BUBBLES
        ===================================================== */

        const bubbles = [];


        for (
            let i = 0;
            i < 100;
            i++
        ) {

            bubbles.push({

                x: random(0, width),

                y: random(
                    0,
                    height
                ),

                size: random(1, 7),

                speed: random(
                    0.15,
                    0.7
                ),

                wobble: random(
                    0,
                    Math.PI * 2
                )

            });

        }


        /* =====================================================
           SMALL FISH
        ===================================================== */

        const fish = [];


        for (
            let i = 0;
            i < 70;
            i++
        ) {

            fish.push({

                x: random(
                    -width,
                    width
                ),

                y: random(
                    height * 0.18,
                    height * 0.82
                ),

                size: random(
                    3,
                    10
                ),

                speed: random(
                    0.3,
                    1.4
                ),

                phase: random(
                    0,
                    Math.PI * 2
                ),

                alpha: random(
                    0.2,
                    0.65
                )

            });

        }


        /* =====================================================
           WHALE
        ===================================================== */

        const whale = {

            x: width * 0.62,

            y: height * 0.48,

            velocityX: 0,

            velocityY: 0,

            angle: 0,

            energy: 0,

            breathing: 0,

            tailMovement: 0
        };


        /* =====================================================
           RIPPLE SYSTEM
        ===================================================== */

        const ripples = [];


        function createRipple(x, y) {

            ripples.push({

                x: x,

                y: y,

                radius: 5,

                alpha: 1,

                speed: 5

            });

        }


        /* =====================================================
           BACKGROUND
        ===================================================== */

        function drawBackground() {

            const gradient =
                ctx.createLinearGradient(
                    0,
                    0,
                    0,
                    height
                );


            gradient.addColorStop(
                0,
                "#03182d"
            );

            gradient.addColorStop(
                0.35,
                "#011526"
            );

            gradient.addColorStop(
                0.7,
                "#000c19"
            );

            gradient.addColorStop(
                1,
                "#000208"
            );


            ctx.fillStyle = gradient;

            ctx.fillRect(
                0,
                0,
                width,
                height
            );


            /* Dark vignette */

            const vignette =
                ctx.createRadialGradient(
                    width / 2,
                    height / 2,
                    height * 0.15,
                    width / 2,
                    height / 2,
                    Math.max(
                        width,
                        height
                    ) * 0.75
                );


            vignette.addColorStop(
                0,
                "rgba(0,0,0,0)"
            );

            vignette.addColorStop(
                1,
                "rgba(0,0,0,0.65)"
            );


            ctx.fillStyle = vignette;

            ctx.fillRect(
                0,
                0,
                width,
                height
            );

        }


        /* =====================================================
           WATER CAUSTICS
        ===================================================== */

        function drawCaustics(time) {

            ctx.save();

            ctx.globalAlpha = 0.055;

            ctx.strokeStyle =
                "#188fff";

            ctx.lineWidth = 1;


            for (
                let row = 0;
                row < 14;
                row++
            ) {

                const baseY =
                    height * 0.08 +
                    row * 55;


                ctx.beginPath();


                for (
                    let x = -50;
                    x <= width + 50;
                    x += 30
                ) {

                    const y =
                        baseY +
                        Math.sin(
                            x * 0.009 +
                            time * 0.5 +
                            row
                        ) * 17;


                    if (x === -50) {

                        ctx.moveTo(
                            x,
                            y
                        );

                    } else {

                        ctx.lineTo(
                            x,
                            y
                        );

                    }

                }

                ctx.stroke();

            }


            ctx.restore();

        }


        /* =====================================================
           PARTICLES
        ===================================================== */

        function drawParticles(time) {

            for (
                let i = 0;
                i < particles.length;
                i++
            ) {

                const p =
                    particles[i];


                p.y -= p.speed;

                p.x += p.drift;


                if (p.y < -10) {

                    p.y =
                        height + 10;

                }


                if (p.x < -10) {

                    p.x =
                        width + 10;

                }


                if (p.x > width + 10) {

                    p.x = -10;

                }


                const pulse =
                    (
                        Math.sin(
                            time * 2 +
                            p.phase
                        ) + 1
                    ) / 2;


                ctx.fillStyle =
                    `rgba(
                        70,
                        170,
                        255,
                        ${p.alpha *
                        (0.35 + pulse * 0.65)}
                    )`;


                ctx.beginPath();

                ctx.arc(
                    p.x,
                    p.y,
                    p.size,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

            }

        }


        /* =====================================================
           FISH
        ===================================================== */

        function drawFish(time) {

            for (
                let i = 0;
                i < fish.length;
                i++
            ) {

                const f =
                    fish[i];


                f.x += f.speed;


                f.y +=
                    Math.sin(
                        time * 0.8 +
                        f.phase
                    ) * 0.15;


                if (
                    f.x >
                    width + 40
                ) {

                    f.x = -40;

                    f.y =
                        random(
                            height * 0.2,
                            height * 0.82
                        );

                }


                ctx.save();

                ctx.translate(
                    f.x,
                    f.y
                );


                ctx.fillStyle =
                    `rgba(
                        70,
                        175,
                        235,
                        ${f.alpha}
                    )`;


                /* Body */

                ctx.beginPath();

                ctx.ellipse(
                    0,
                    0,
                    f.size,
                    f.size * 0.42,
                    0,
                    0,
                    Math.PI * 2
                );

                ctx.fill();


                /* Tail */

                ctx.beginPath();

                ctx.moveTo(
                    -f.size,
                    0
                );

                ctx.lineTo(
                    -f.size * 2,
                    -f.size * 0.8
                );

                ctx.lineTo(
                    -f.size * 2,
                    f.size * 0.8
                );

                ctx.closePath();

                ctx.fill();


                ctx.restore();

            }

        }


        /* =====================================================
           BUBBLES
        ===================================================== */

        function drawBubbles(time) {

            for (
                let i = 0;
                i < bubbles.length;
                i++
            ) {

                const b =
                    bubbles[i];


                b.y -= b.speed;


                b.x +=
                    Math.sin(
                        time +
                        b.wobble
                    ) * 0.25;


                if (b.y < -20) {

                    b.y =
                        height + 20;

                    b.x =
                        random(
                            0,
                            width
                        );

                }


                ctx.strokeStyle =
                    "rgba(100,190,255,0.22)";

                ctx.lineWidth = 1;


                ctx.beginPath();

                ctx.arc(
                    b.x,
                    b.y,
                    b.size,
                    0,
                    Math.PI * 2
                );

                ctx.stroke();

            }

        }


        /* =====================================================
           WHALE MOVEMENT
        ===================================================== */

        function updateWhale(time) {

            /*
             * Natural swimming.
             */

            const naturalX =
                width * 0.63 +
                Math.sin(
                    time * 0.18
                ) *
                width *
                0.13;


            const naturalY =
                height * 0.48 +
                Math.sin(
                    time * 0.35
                ) * 35;


            whale.velocityX +=
                (
                    naturalX -
                    whale.x
                ) * 0.0007;


            whale.velocityY +=
                (
                    naturalY -
                    whale.y
                ) * 0.0007;


            /*
             * Distance from pointer.
             */

            const dx =
                pointer.x -
                whale.x;

            const dy =
                pointer.y -
                whale.y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            /*
             * Whale notices
             * the pointer.
             */

            if (distance < 500) {

                const force =
                    1 -
                    distance / 500;


                whale.energy =
                    clamp(
                        whale.energy +
                        force * 0.015,
                        0,
                        1
                    );


                whale.velocityX +=
                    dx *
                    force *
                    0.00006;


                whale.velocityY +=
                    dy *
                    force *
                    0.00006;

            }


            /*
             * When touched,
             * whale moves away.
             */

            if (
                pointer.down &&
                distance < 450
            ) {

                whale.velocityX -=
                    dx * 0.00025;

                whale.velocityY -=
                    dy * 0.00025;

                whale.energy =
                    clamp(
                        whale.energy + 0.04,
                        0,
                        1
                    );

            }


            /*
             * Limit velocity.
             */

            whale.velocityX =
                clamp(
                    whale.velocityX,
                    -2.5,
                    2.5
                );


            whale.velocityY =
                clamp(
                    whale.velocityY,
                    -1.5,
                    1.5
                );


            /*
             * Friction.
             */

            whale.velocityX *=
                0.985;

            whale.velocityY *=
                0.985;


            /*
             * Move.
             */

            whale.x +=
                whale.velocityX;

            whale.y +=
                whale.velocityY;


            /*
             * Keep whale on screen.
             */

            whale.x =
                clamp(
                    whale.x,
                    width * 0.25,
                    width * 0.86
                );


            whale.y =
                clamp(
                    whale.y,
                    height * 0.25,
                    height * 0.75
                );


            /*
             * Whale rotation.
             */

            whale.angle =
                whale.velocityY *
                0.15;


            /*
             * Tail.
             */

            whale.tailMovement =
                Math.sin(
                    time * 3
                ) * 0.18;


            /*
             * Breathing.
             */

            whale.breathing =
                Math.sin(
                    time * 0.8
                );


            /*
             * Energy fades.
             */

            whale.energy *=
                0.985;

        }


        /* =====================================================
           WHALE GLOW
        ===================================================== */

        function drawWhaleGlow() {

            const radius =
                300 +
                whale.energy * 150;


            const glow =
                ctx.createRadialGradient(
                    whale.x,
                    whale.y,
                    10,

                    whale.x,
                    whale.y,
                    radius
                );


            glow.addColorStop(
                0,
                `rgba(
                    0,
                    130,
                    255,
                    ${0.13 +
                    whale.energy * 0.15}
                )`
            );


            glow.addColorStop(
                0.4,
                "rgba(0,80,220,0.06)"
            );


            glow.addColorStop(
                1,
                "rgba(0,0,0,0)"
            );


            ctx.fillStyle =
                glow;


            ctx.beginPath();

            ctx.arc(
                whale.x,
                whale.y,
                radius,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }


        /* =====================================================
           WHALE BODY
        ===================================================== */

        function drawWhale(time) {

            ctx.save();


            ctx.translate(
                whale.x,
                whale.y
            );


            ctx.rotate(
                whale.angle
            );


            /*
             * Subtle breathing.
             */

            const breathingScale =
                1 +
                whale.breathing *
                0.018;


            ctx.scale(
                breathingScale,
                breathingScale
            );


            /*
             * Main body gradient.
             */

            const bodyGradient =
                ctx.createLinearGradient(
                    -280,
                    -50,
                    270,
                    60
                );


            bodyGradient.addColorStop(
                0,
                "#03182d"
            );


            bodyGradient.addColorStop(
                0.25,
                "#063456"
            );


            bodyGradient.addColorStop(
                0.55,
                "#07527d"
            );


            bodyGradient.addColorStop(
                0.8,
                "#063454"
            );


            bodyGradient.addColorStop(
                1,
                "#01101e"
            );


            /*
             * Main whale body.
             */

            ctx.fillStyle =
                bodyGradient;


            ctx.shadowBlur =
                25 +
                whale.energy * 35;


            ctx.shadowColor =
                "#087cff";


            ctx.beginPath();

            ctx.ellipse(
                0,
                0,
                270,
                82,
                0,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.shadowBlur = 0;


            /*
             * Head.
             */

            const headGradient =
                ctx.createLinearGradient(
                    140,
                    -60,
                    260,
                    70
                );


            headGradient.addColorStop(
                0,
                "#0a527c"
            );


            headGradient.addColorStop(
                1,
                "#02182b"
            );


            ctx.fillStyle =
                headGradient;


            ctx.beginPath();

            ctx.ellipse(
                215,
                -3,
                95,
                70,
                -0.03,
                0,
                Math.PI * 2
            );

            ctx.fill();


            /*
             * Belly.
             */

            const belly =
                ctx.createLinearGradient(
                    0,
                    10,
                    0,
                    100
                );


            belly.addColorStop(
                0,
                "rgba(50,155,205,0.42)"
            );


            belly.addColorStop(
                1,
                "rgba(0,25,45,0)"
            );


            ctx.fillStyle =
                belly;


            ctx.beginPath();

            ctx.ellipse(
                15,
                48,
                190,
                35,
                0,
                0,
                Math.PI * 2
            );

            ctx.fill();


            /*
             * Tail.
             */

            ctx.save();


            ctx.translate(
                -265,
                0
            );


            ctx.rotate(
                whale.tailMovement
            );


            ctx.fillStyle =
                "#041e35";


            /*
             * Upper tail.
             */

            ctx.beginPath();

            ctx.moveTo(
                10,
                0
            );

            ctx.quadraticCurveTo(
                -50,
                -85,
                -140,
                -60
            );

            ctx.quadraticCurveTo(
                -80,
                -5,
                10,
                8
            );

            ctx.closePath();

            ctx.fill();


            /*
             * Lower tail.
             */

            ctx.beginPath();

            ctx.moveTo(
                10,
                0
            );

            ctx.quadraticCurveTo(
                -50,
                85,
                -140,
                60
            );

            ctx.quadraticCurveTo(
                -80,
                5,
                10,
                -8
            );

            ctx.closePath();

            ctx.fill();


            /*
             * Tail edges.
             */

            ctx.strokeStyle =
                "rgba(30,130,200,0.28)";

            ctx.lineWidth = 2;


            ctx.beginPath();

            ctx.moveTo(
                0,
                0
            );

            ctx.quadraticCurveTo(
                -60,
                -55,
                -130,
                -50
            );

            ctx.stroke();


            ctx.beginPath();

            ctx.moveTo(
                0,
                0
            );

            ctx.quadraticCurveTo(
                -60,
                55,
                -130,
                50
            );

            ctx.stroke();


            ctx.restore();


            /*
             * Pectoral fin.
             */

            const finGradient =
                ctx.createLinearGradient(
                    60,
                    30,
                    150,
                    140
                );


            finGradient.addColorStop(
                0,
                "#0a4165"
            );


            finGradient.addColorStop(
                1,
                "#02182b"
            );


            ctx.fillStyle =
                finGradient;


            ctx.beginPath();

            ctx.moveTo(
                55,
                40
            );

            ctx.quadraticCurveTo(
                90,
                105,
                155,
                135
            );

            ctx.quadraticCurveTo(
                125,
                65,
                65,
                25
            );

            ctx.closePath();

            ctx.fill();


            /*
             * Second subtle fin.
             */

            ctx.fillStyle =
                "#041d34";


            ctx.beginPath();

            ctx.moveTo(
                -20,
                42
            );

            ctx.quadraticCurveTo(
                -10,
                75,
                40,
                88
            );

            ctx.quadraticCurveTo(
                20,
                45,
                -10,
                25
            );

            ctx.closePath();

            ctx.fill();


            /*
             * Eye glow.
             */

            ctx.shadowBlur = 25;

            ctx.shadowColor =
                "#00baff";


            ctx.fillStyle =
                "#7eeaff";


            ctx.beginPath();

            ctx.arc(
                230,
                -22,
                6,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.shadowBlur = 0;


            /*
             * Eye center.
             */

            ctx.fillStyle =
                "#ffffff";


            ctx.beginPath();

            ctx.arc(
                232,
                -23,
                2,
                0,
                Math.PI * 2
            );

            ctx.fill();


            /*
             * Bioluminescent spots.
             */

            for (
                let i = 0;
                i < 28;
                i++
            ) {

                const x =
                    -145 +
                    i * 11;


                const y =
                    Math.sin(
                        i * 1.7
                    ) * 30;


                const pulse =
                    (
                        Math.sin(
                            time * 2.5 +
                            i * 0.7
                        ) + 1
                    ) / 2;


                ctx.fillStyle =
                    `rgba(
                        35,
                        190,
                        255,
                        ${0.25 +
                        pulse * 0.65}
                    )`;


                ctx.shadowBlur =
                    10 +
                    pulse * 10;


                ctx.shadowColor =
                    "#009cff";


                ctx.beginPath();

                ctx.arc(
                    x,
                    y,
                    1.5 +
                    pulse * 2.2,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

            }


            ctx.shadowBlur = 0;


            /*
             * Highlight along back.
             */

            ctx.strokeStyle =
                "rgba(80,200,255,0.24)";

            ctx.lineWidth = 3;


            ctx.beginPath();

            ctx.ellipse(
                0,
                -3,
                260,
                77,
                0,
                Math.PI * 1.05,
                Math.PI * 1.9
            );

            ctx.stroke();


            /*
             * Subtle mouth.
             */

            ctx.strokeStyle =
                "rgba(0,10,20,0.7)";

            ctx.lineWidth = 2;


            ctx.beginPath();

            ctx.arc(
                270,
                12,
                35,
                0.4,
                1.8
            );

            ctx.stroke();


            ctx.restore();

        }


        /* =====================================================
           POINTER LIGHT
        ===================================================== */

        function drawPointerLight() {

            const radius =
                pointer.down
                    ? 300
                    : 190;


            const light =
                ctx.createRadialGradient(
                    pointer.x,
                    pointer.y,
                    0,

                    pointer.x,
                    pointer.y,
                    radius
                );


            light.addColorStop(
                0,
                pointer.down
                    ? "rgba(50,180,255,0.22)"
                    : "rgba(40,150,255,0.09)"
            );


            light.addColorStop(
                0.35,
                "rgba(20,100,220,0.04)"
            );


            light.addColorStop(
                1,
                "rgba(0,0,0,0)"
            );


            ctx.fillStyle =
                light;


            ctx.beginPath();

            ctx.arc(
                pointer.x,
                pointer.y,
                radius,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }


        /* =====================================================
           RIPPLES
        ===================================================== */

        function drawRipples() {

            for (
                let i = ripples.length - 1;
                i >= 0;
                i--
            ) {

                const ripple =
                    ripples[i];


                ripple.radius +=
                    ripple.speed;


                ripple.alpha *=
                    0.955;


                ctx.strokeStyle =
                    `rgba(
                        60,
                        190,
                        255,
                        ${ripple.alpha}
                    )`;


                ctx.lineWidth = 2;


                ctx.shadowBlur = 20;

                ctx.shadowColor =
                    "#008cff";


                ctx.beginPath();

                ctx.arc(
                    ripple.x,
                    ripple.y,
                    ripple.radius,
                    0,
                    Math.PI * 2
                );

                ctx.stroke();


                ctx.shadowBlur = 0;


                if (
                    ripple.alpha <
                    0.025
                ) {

                    ripples.splice(
                        i,
                        1
                    );

                }

            }

        }


        /* =====================================================
           WHALE PROXIMITY EFFECT
        ===================================================== */

        function drawProximity(time) {

            const dx =
                pointer.x -
                whale.x;

            const dy =
                pointer.y -
                whale.y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (distance < 500) {

                const alpha =
                    1 -
                    distance / 500;


                ctx.save();

                ctx.globalAlpha =
                    alpha * 0.12;


                ctx.strokeStyle =
                    "#20aaff";

                ctx.lineWidth = 1;


                ctx.beginPath();

                ctx.arc(
                    whale.x,
                    whale.y,
                    130 +
                    Math.sin(time * 2) * 8,
                    0,
                    Math.PI * 2
                );

                ctx.stroke();


                ctx.restore();

            }

        }


        /* =====================================================
           MAIN ANIMATION
        ===================================================== */

        let lastTime = 0;


        function animate(timestamp) {

            requestAnimationFrame(
                animate
            );


            const time =
                timestamp / 1000;


            /*
             * Smooth pointer.
             */

            pointer.x +=
                (
                    pointer.targetX -
                    pointer.x
                ) * 0.08;


            pointer.y +=
                (
                    pointer.targetY -
                    pointer.y
                ) * 0.08;


            /*
             * Background.
             */

            drawBackground();


            /*
             * Water lighting.
             */

            drawCaustics(
                time
            );


            /*
             * Deep particles.
             */

            drawParticles(
                time
            );


            /*
             * Fish behind whale.
             */

            drawFish(
                time
            );


            /*
             * Bubbles.
             */

            drawBubbles(
                time
            );


            /*
             * Whale.
             */

            updateWhale(
                time
            );


            drawWhaleGlow();


            drawProximity(
                time
            );


            drawWhale(
                time
            );


            /*
             * Pointer underwater light.
             */

            drawPointerLight();


            /*
             * Touch ripples.
             */

            drawRipples();

        }


        /* =====================================================
           START
        ===================================================== */

        requestAnimationFrame(
            animate
        );

    </script>

</body>
</html>
